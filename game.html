<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <title>Memory – Game</title>
</head>
<body class="game-page">

    <!-- GAME-HEADER -->
    <header class="game-header">
        <h1 class="visually-hidden">
            Memory game
        </h1>

        <!-- SCOREBOARD -->
        <ul class="game-score" aria-label="Score" aria-live="polite" aria-atomic="true">

            <!-- SCORE-BLUE -->
            <li class="game-score__player game-score__player--blue">
                <img
                    src="./assets/img/player-marker-blue.png"
                    class="game-score__marker"
                    alt=""
                >
                <span class="game-score__name">
                    Blue
                </span>
                <span id="blue-player-points"
                      class="game-score__points"
                      data-value="0"
                      data-label="Blue Player Points">
                    0
                </span>
            </li>

            <!-- SCORE-ORANGE -->
            <li class="game-score__player game-score__player--orange">
                <img
                    src="./assets/img/player-marker-orange.png"
                    class="game-score__marker"
                    alt=""
                >
                <span class="game-score__name">
                    Orange
                </span>
                <span id="orange-player-points"
                      class="game-score__points"
                      data-value="0"
                      data-label="Orange Player Points">
                    0
                </span>
            </li>
        </ul>

        <!-- CURRENT PLAYER -->
        <p class="game-header__current-player" aria-live="polite" aria-atomic="true">
            <span class="game-header__current-player-label">
                Current player:
            </span>
            <img
                src="./assets/img/player-marker-blue.png"
                class="game-header__current-player-marker"
                alt="Blue"
            >
        </p>

        <!-- EXIT-BUTTON -->
        <button type="button" class="game-header__exit" aria-haspopup="dialog">
            <img
                src="./assets/img/icon-exit-game.png"
                class="game-header__exit-icon"
                alt="">
            <img
                src="./assets/img/icon-exit-game-blue.png"
                class="game-header__exit-icon-alt"
                alt="">
            <span class="game-header__exit-label">
                Exit game
            </span>
        </button>
    </header>

    <!-- GAME-CONTENT -->
    <main class="game-page__main game-board">
        <!-- dynamic content: game cards will be populated here -->

        <!-- GAME OVER OVERLAY -->
        <section class="game-over d-none" aria-labelledby="game-over-message">
            <img
                id="game-over-screen"
                class="d-none"
                src="./assets/img/game-over-screen.png"
                alt="Game over"
            >
            <h2 id="game-over-message" class="game-over__message d-none">
                Game over
            </h2>

            <!-- FINAL SCORE -->
            <div class="game-over__scoreboard">
                <p class="game-over__scoreboard--text">
                    Final score
                </p>
                <!-- dynamic content: final score will be populated here -->
            </div>
        </section>

        <!-- GAME RESULT OVERLAY -->
        <section class="game-result d-none" aria-label="Game result">
            <img
                src="./assets/img/confetti.png"
                class="game-result__confetti"
                alt=""
            >
            <img
                src="./assets/img/confetti-wide.png"
                class="game-result__confetti-wide"
                alt=""
            >
            <!-- dynamic content: winner or draw message will be populated here -->
        </section>

        <!-- EXIT DIALOG -->
        <dialog class="exit-dialog" aria-labelledby="exit-dialog-question">
            <p id="exit-dialog-question" class="exit-dialog__question">
                Are you sure you want to quit the game?
            </p>

            <!-- DIALOG ACTIONS -->
            <div class="exit-dialog__actions">
                <button type="button" class="exit-dialog__button exit-dialog__button--back">
                    Back to game
                </button>
                <a href="./settings.html" class="exit-dialog__button exit-dialog__button--exit">
                    Exit game
                </a>
            </div>
        </dialog>
    </main>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>

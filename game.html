<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Play</title>
</head>
<body class="game-page">
    <header class="game-header">
        <ul class="game-score">
            <li class="game-score__player game-score__player--blue">
                <img 
                     src="./public/assets/img/player-marker-blue.png"
                     class="game-score__marker"
                     alt=""
                >
                <span class="game-score__name">
                    Blue
                </span>
                <span id="blue-player-points" 
                      class="game-score__points"
                      data-value="0"
                      data-label="Blue Player Points">
                    0
                </span>
            </li>
            <li class="game-score__player game-score__player--orange">
                <img 
                     src="./public/assets/img/player-marker-orange.png"
                     class="game-score__marker"
                     alt=""
                >
                <span class="game-score__name">
                    Orange
                </span>
                <span id="orange-player-points"
                      class="game-score__points"
                      data-value="0"
                      data-label="Orange Player Points">
                    0
                </span>
            </li>
        </ul>

        <p class="game-header__current-player">
            <span class="game-header__current-player-label">
                Current player:
            </span>
            <img 
                 src="./public/assets/img/player-marker-blue.png" 
                 class="game-header__current-player-marker"
                 alt=""
            >
        </p>

    <button type="button" class="game-header__exit">
        <img
            src="./public/assets/img/icon-exit-game.png"
            class="game-header__exit-icon"
            alt="">
        <img
            src="./public/assets/img/icon-exit-game-blue.png"
            class="game-header__exit-icon-alt"
            alt="">
        <span class="game-header__exit-label">
            Exit game
        </span>
    </button>
    </header>
    <main class="game-page__main">
        <section class="game-board">

        </section>
        <section class="game-over d-none">

            <img id="game-over-screen" class="d-none" src="./public/assets/img/game-over-screen.png" alt="">
            <span id="game-over-message" class="d-none game-over__message">
                GAME OVER
            </span>
            
            <div class="game-over__scoreboard">
                <span class="game-over__scoreboard--text">Final score</span>
            </div>
        </section>
        <section class="game-result d-none">
            <img
                src="./public/assets/img/confetti.png"
                class="game-result__confetti"
                alt=""
            >
            <p class="game-result__intro">
                The winner is
            </p>
            <p class="game-result__winner">
                Orange Player
            </p>
            <img
                src="./public/assets/img/draw-text.png"
                class="game-result__winner-img d-none"
                alt="Draw"
            >
            <img
                src="./public/assets/img/result-icon-orange.png"
                class="game-result__icon"
                alt=""
            >
            <a href="./index.html" class="game-result__button">
                Back to start
            </a>
        </section>

        <dialog class="exit-dialog">
            <p class="exit-dialog__question">
                Are you sure you want to quit the game?
            </p>
            <div class="exit-dialog__actions">
                <button type="button" class="exit-dialog__button exit-dialog__button--back">
                    Back to game
                </button>
                <a href="./settings.html" class="exit-dialog__button exit-dialog__button--exit">
                    Exit game
                </a>
            </div>
        </dialog>
    </main>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>

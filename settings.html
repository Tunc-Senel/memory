<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Settings</title>
</head>
<body class="settings-page">
    <header class="settings-header">
        <h1 class="settings-header__title">
            Settings
        </h1>
        <img
             src="./public/assets/img/underline-accent-settings.png"
             class="settings-header__underline"
             alt=""
        >
    </header>
    <main class="settings-page__main">
        
        <section class="settings-page__options">

            <article class="settings-option">
                <header class="settings-option__header">
                    <img
                         src="./public/assets/img/icon-game-theme.png"
                         class="settings-option__icon"
                         alt="Symbol für Themenauswahl"
                    >
                    <h2 class="settings-option__title">
                        Game themes
                    </h2>
                </header> 
                <ul class="settings-option__list">
                    <li class="settings-option__list-item settings-option__list-item--active">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             class="d-none"
                             alt="">
                        <span>
                            Code vibes theme
                        </span>
                    </li>
                    <li class="settings-option__list-item">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             class="d-none"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             alt="">
                        <span>
                            Gaming theme
                        </span>
                    </li>
                </ul>
            </article>

            <article class="settings-option">
                <header class="settings-option__header">
                    <img
                         src="./public/assets/img/icon-choose-player.png"
                         class="settings-option__icon"
                         alt="Symbol für Spielerauswahl"
                    >
                    <h2 class="settings-option__title">
                        Choose Player
                    </h2>
                </header>
                <ul class="settings-option__list">
                    <li class="settings-option__list-item">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             class="d-none"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             alt="">
                        <span>
                            Blue
                        </span>
                    </li>
                    <li class="settings-option__list-item">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             class="d-none"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             alt="">
                        <span>
                            Orange
                        </span>
                    </li>
                </ul>
            </article>

            <article class="settings-option">
                <header class="settings-option__header">
                    <img
                         src="./public/assets/img/icon-board-size.png"
                         class="settings-option__icon"
                         alt="Symbol für Spielfeldgröße"
                    >
                    <h2 class="settings-option__title">
                        Board size
                    </h2>
                </header>
                <ul class="settings-option__list">
                    <li class="settings-option__list-item">
                    <img
                            src="./public/assets/img/radio-checked.png"
                            class="d-none"
                            alt="">
                    <img 
                            src="./public/assets/img/radio-unchecked.png"
                            alt="">
                    <span>
                        16 cards
                    </span>
                    </li>
                    <li class="settings-option__list-item">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             class="d-none"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             alt="">
                        <span>
                            24 cards
                        </span> 
                    </li>
                    <li class="settings-option__list-item">
                        <img
                             src="./public/assets/img/radio-checked.png"
                             class="d-none"
                             alt="">
                        <img 
                             src="./public/assets/img/radio-unchecked.png"
                             alt="">
                        <span>
                            36 cards
                        </span>
                    </li>
                </ul>
            </article>

        </section>

        <section class="settings-page__summary">

                <figure class="settings-preview">
                    <img
                         src="./public/assets/img/theme-preview-code-vibes.png"
                         class="settings-preview__image"
                         alt="Vorschau des Themes Code vibes mit Code- und Git-Symbol"
                    >
                </figure>

            <ul class="settings-progress">
                <li class="settings-progress__step">
                    Game theme
                </li>
                <span>
                    <img src="./public/assets/img/divider-accent.png" alt="">
                </span>
                <li class="settings-progress__step">
                    Player
                </li>
                <span>
                    <img src="./public/assets/img/divider-accent.png" alt="">
                </span>
                <li class="settings-progress__step">
                    Board size
                </li>
                <li class="settings-progress__step settings-progress__step--start">
                    <button class="settings-progress__start-button">
                        <img
                             src="./public/assets/img/icon-start-game.png"
                             class="settings-progress__start-icon"
                             alt=""
                        >
                        <span class="settings-progress__start-label">
                            Start
                        </span>
                    </button>
                </li>
            </ul>

        </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/img/icons/favicon.png">
    <title>Memory – Settings</title>
</head>
<body class="settings-page">

    <!-- SETTINGS-HEADER -->
    <header class="settings-header">
        <h1 class="settings-header__title">
            Settings
        </h1>
        <img
            src="./assets/img/underline-accent-settings.png"
            class="settings-header__underline"
            alt=""
        >
    </header>

    <!-- SETTINGS-CONTENT -->
    <main class="settings-page__main">

        <!-- LEFT COLUMN: OPTIONS -->
        <section class="settings-page__options" aria-label="Game options">

            <!-- GAME THEMES -->
            <fieldset class="settings-option settings-option--preview" data-step="step-theme">
                <legend class="settings-option__legend">
                    <img
                        src="./assets/img/icon-game-theme.png"
                        class="settings-option__icon"
                        alt=""
                    >
                    <h2 class="settings-option__title">
                        Game themes
                    </h2>
                </legend>

                <!-- THEME-CODE-VIBES -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="theme"
                        value="code-vibes"
                        class="settings-option__radio"
                        data-label="Code vibes theme"
                        checked
                    >
                    <span class="settings-option__label">
                        Code vibes theme
                    </span>
                </label>

                <!-- THEME-DA-PROJECTS -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="theme"
                        value="da-projects"
                        class="settings-option__radio"
                        data-label="DA Projects theme"
                    >
                    <span class="settings-option__label">
                        DA Projects theme
                    </span>
                </label>
            </fieldset>

            <!-- CHOOSE PLAYER -->
            <fieldset class="settings-option" data-step="step-player">
                <legend class="settings-option__legend">
                    <img
                        src="./assets/img/icon-choose-player.png"
                        class="settings-option__icon"
                        alt=""
                    >
                    <h2 class="settings-option__title">
                        Choose player
                    </h2>
                </legend>

                <!-- PLAYER-BLUE -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="player"
                        value="blue"
                        class="settings-option__radio"
                        data-label="Blue Player"
                    >
                    <span class="settings-option__label">
                        Blue
                    </span>
                </label>

                <!-- PLAYER-ORANGE -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="player"
                        value="orange"
                        class="settings-option__radio"
                        data-label="Orange Player"
                    >
                    <span class="settings-option__label">
                        Orange
                    </span>
                </label>
            </fieldset>

            <!-- BOARD SIZE -->
            <fieldset class="settings-option" data-step="step-board">
                <legend class="settings-option__legend">
                    <img
                        src="./assets/img/icon-board-size.png"
                        class="settings-option__icon"
                        alt=""
                    >
                    <h2 class="settings-option__title">
                        Board size
                    </h2>
                </legend>

                <!-- BOARD-16-CARDS -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="board-size"
                        value="16"
                        class="settings-option__radio"
                        data-label="Board-16 Cards"
                    >
                    <span class="settings-option__label">
                        16 cards
                    </span>
                </label>

                <!-- BOARD-24-CARDS -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="board-size"
                        value="24"
                        class="settings-option__radio"
                        data-label="Board-24 Cards"
                    >
                    <span class="settings-option__label">
                        24 cards
                    </span>
                </label>

                <!-- BOARD-36-CARDS -->
                <label class="settings-option__choice">
                    <input
                        type="radio"
                        name="board-size"
                        value="36"
                        class="settings-option__radio"
                        data-label="Board-36 Cards"
                    >
                    <span class="settings-option__label">
                        36 cards
                    </span>
                </label>
            </fieldset>

        </section>

        <!-- RIGHT COLUMN: SUMMARY -->
        <section class="settings-page__summary" aria-label="Selection summary">

            <!-- THEME PREVIEW -->
            <div class="settings-preview">
                <img
                    src="./assets/img/theme-preview-code-vibes.png"
                    id="theme-img"
                    class="settings-preview__image"
                    alt="Preview of the Code vibes theme with code and Git icons"
                >
            </div>

            <!-- PROGRESS BAR -->
            <ul class="settings-progress" aria-label="Selection progress" aria-live="polite">

                <!-- STEP-THEME -->
                <li id="step-theme" class="settings-progress__step">
                    Code vibes theme
                </li>

                <!-- DIVIDER -->
                <li class="settings-progress__divider" aria-hidden="true">
                    <img
                        src="./assets/img/divider-accent.png"
                        class="settings-progress__divider-default"
                        alt="">
                    <img
                        src="./assets/img/divider-accent-bent.png"
                        class="settings-progress__divider-applied d-none"
                        alt="">
                </li>

                <!-- STEP-PLAYER -->
                <li id="step-player" class="settings-progress__step">
                    Player
                </li>

                <!-- DIVIDER -->
                <li class="settings-progress__divider" aria-hidden="true">
                    <img
                        src="./assets/img/divider-accent.png"
                        class="settings-progress__divider-default"
                        alt="">
                    <img
                        src="./assets/img/divider-accent-bent.png"
                        class="settings-progress__divider-applied d-none"
                        alt="">
                </li>

                <!-- STEP-BOARD -->
                <li id="step-board" class="settings-progress__step">
                    Board size
                </li>

                <!-- START-BUTTON -->
                <li class="settings-progress__step--start">
                    <a href="./game.html"
                       class="settings-progress__start-button settings-progress__start-button--disabled"
                       aria-disabled="true"
                       aria-describedby="start-hint">
                        <img
                            src="./assets/img/icon-start-game.png"
                            class="settings-progress__start-icon"
                            alt=""
                        >
                        <span class="settings-progress__start-label">
                            Start
                        </span>
                    </a>
                    <span id="start-hint" class="settings-progress__start-hint" role="tooltip">
                        Your selection is incomplete
                    </span>
                </li>

            </ul>

        </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Settings</title>
</head>
<body>
    <header>
        <h1>
            Settings
        </h1>
        <img 
             src="./public/assets/img/underline-accent-settings.png"
             alt=""
        >
    </header>
    <main>
        <section>
            <article>
                <header>
                    <img
                         src="./public/assets/img/icon-game-theme.png"
                         alt="Symbol für Themenauswahl"
                    >
                    <h2>
                        Game themes
                    </h2>
                </header> 
                <ul>
                    <li>Code vibes theme</li>
                    <li>Gaming theme</li>
                </ul>
            </article>

            <article>
                <header>
                    <img
                         src="./public/assets/img/icon-choose-player.png"
                         alt="Symbol für Spielerauswahl"
                    >
                    <h2>
                        Choose Player
                    </h2>
                </header>
                <ul>
                    <li>Blue</li>
                    <li>Orange</li>
                </ul>
            </article>

            <article>
                <header>
                    <img
                         src="./public/assets/img/icon-board-size.png"
                         alt="Symbol für Spielfeldgröße"
                    >
                    <h2>
                        Board size
                    </h2>
                </header>
                <ul>
                    <li>16 cards</li>
                    <li>24 cards</li>
                    <li>36 cards</li>
                </ul>
            </article>

        </section>
        <section>
            <article>
                <figure>
                    <img
                         src="./public/assets/img/theme-preview-code-vibes.png"
                         alt="Vorschau des Themes Code vibes mit Code- und Git-Symbol"
                    >
                    <figcaption>
                        Theme-Vorschau: Code vibes
                    </figcaption>
                </figure>
            </article>
            <ul>
                <li>
                    Game theme
                </li>
                <li>
                    Player
                </li>
                <li>
                    Board size
                </li>
                <li>
                    <div>
                        <img
                             src="./public/assets/img/icon-start-game.png"
                             alt=""
                        >
                        <span>
                            Start
                        </span>
                    </div>
                </li>
            </ul>
            <article>

            </article>
        </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
